name: rehlaa
description: Rehlaa — Flutter marketplace application for Android and iOS.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & dependency injection
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2

  # Navigation
  go_router: ^17.3.0

  # Immutable models & JSON serialization
  freezed_annotation: 3.1.0
  json_annotation: 4.10.0

  # Local relational read cache
  drift: 2.30.1
  drift_flutter: 0.2.8

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.7.0

  # Localization
  intl: ^0.20.2

  # Images
  cached_network_image: ^3.4.1

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Logging
  logger: ^2.4.0

  # SVG support (required by design system)
  flutter_svg: ^2.0.10+1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.10.4
  riverpod_generator: 4.0.3
  freezed: 3.2.5
  json_serializable: 6.12.0
  drift_dev: 2.30.1

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/

  fonts:
    - family: PlusJakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700
